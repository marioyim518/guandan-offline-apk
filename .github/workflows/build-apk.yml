      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 Platform 34 与 Build Tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      - name: 命令行构建 APK
        run: bash build-apk.sh

      - name: 生成 Release（可直接下载安装）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: 掼蛋单机版 v1.0
          body: 离线单机掼蛋 APK，WebView 壳 + 内嵌规则引擎，断网可玩。自签名，Android 6.0+ 可直接安装。
          files: dist/Guandan-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
